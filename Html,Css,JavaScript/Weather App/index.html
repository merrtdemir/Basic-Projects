<!doctype html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Weather Forecast App</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <link rel="stylesheet" href="style.css">
</head>

<body>

  
         <div  class="container mt-3  ">
      <div class="row justify-content-center ">

         <div class="col-11 col-sm-8  d-flex flex-column align-items-center justify-content-center p-4 rounded text-center ">

            <h1 class="fw-bold pb-2 ">Weather Forecast</h1>
            <input id="SearchBar" class="col-10  border border-dark rounded text-center"  type="search" placeholder="Type your Location.." id="InputBox" value="">
            <div class="my-4">
               <h2 id="CityName" class="m-0 fs-3 fw-bold ">Istanbul,TR</h2>
            </div>


            <div class="d-flex align-items-center justify-content-center gap-3">
               <img id="WeatherImage" alt="Hava Durumu" src="/02.svg" style="width: 60px; height: 60px;">
               <h2 id="CurrentTemp" class="m-0 fs-1 fw-semibold">20°C</h2>
               

            </div>
           
            <div class="WeatherDescription">
               <h2 style="font-family: 'Helvetica';" id="Description" class="m-0 fs-3 fw-semibold pb-4 mt-3">Parçalı Bulutlu</h2>
            </div>

                <div class="d-flex align-items-center justify-content-center pt-3">
                  <div class="minmax">
                     <h2 class="m-0 fs-4 fw-normal">Todays Temperatures</h2>
                    <span id="min_temp" class="m-0 fs-4 fw-normal">14°C</span>/ <span id="max_temp" class="m-0 fs-4 fw-normal">21°C</span>
     
                  </div>
                  

            </div>


              <div class="d-flex align-items-center justify-content-center gap-5 pt-4">

         <div id="WindSection">
                  <h2  class="m-0 fs-4 fw-semibold" >Wind Speed</h2>
               <h2 id="windSpeed" class="m-0 fs-4 fw-semibold">10km/s</h2>
         </div>

           <div id="HumiditySection">
                  <h2 class="m-0 fs-4 fw-semibold" >Humidity</h2>
               <h2 id="Humudity" class="m-0 fs-4 fw-semibold">%20</h2>
         </div>

            </div>

         </div>


      </div>
        
   </div>
   



      






   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
   <script src="script.js"></script>
</body>

</html>
